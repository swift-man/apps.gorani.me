media:
  - name: app_images
    label: 앱 이미지
    input: public/images/apps
    output: /images/apps
    categories: [image]
    extensions: [avif, gif, jpeg, jpg, png, svg, webp]
    rename: false

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: 'docs. 앱 콘텐츠 생성: {path}'
      update: 'docs. 앱 콘텐츠 수정: {path}'
      delete: 'docs. 앱 콘텐츠 삭제: {path}'
      rename: 'docs. 앱 콘텐츠 이름 변경: {oldPath} -> {newPath}'

components:
  image_size:
    type: object
    label: 이미지 크기
    fields:
      - name: width
        label: 너비
        type: number
        required: true
        options:
          min: 1
      - name: height
        label: 높이
        type: number
        required: true
        options:
          min: 1

  localized_label:
    type: object
    label: 접근성 설명
    fields:
      - name: ko
        label: 한국어
        type: string
        required: true
      - name: en
        label: English
        type: string
        required: true
      - name: ja
        label: 日本語
        type: string
        required: true

  localized_content:
    type: object
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: shortDescription
        label: 짧은 설명
        type: text
        required: true
      - name: longDescription
        label: 상세 설명
        type: text
        required: true
      - name: features
        label: 주요 기능
        type: string
        required: true
        list:
          min: 1
      - name: steps
        label: 사용 방법
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - name: title
            label: 단계 제목
            type: string
            required: true
          - name: description
            label: 단계 설명
            type: text
            required: true
      - name: faq
        label: 자주 묻는 질문
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{question}'
        fields:
          - name: question
            label: 질문
            type: string
            required: true
          - name: answer
            label: 답변
            type: text
            required: true
      - name: seoTitle
        label: SEO 제목
        type: string
        required: true
      - name: seoDescription
        label: SEO 설명
        type: text
        required: true

content:
  - name: apps
    label: 앱 콘텐츠
    type: collection
    path: src/data/apps
    format: json
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: name
      fields: [name, platform, status]
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: slug
        label: URL slug
        type: string
        required: true
        readonly: true
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      - name: name
        label: 앱 이름
        type: string
        required: true
      - name: platform
        label: 표시 플랫폼
        type: string
        required: true
      - name: platformGroup
        label: 플랫폼 그룹
        type: select
        required: true
        options:
          values:
            - name: macos
              label: macOS
            - name: mobile
              label: iPhone & iPad
            - name: tv
              label: Apple TV
      - name: category
        label: 카테고리
        type: string
        required: true
      - name: status
        label: 출시 상태
        type: select
        required: true
        options:
          values:
            - name: released
              label: 출시됨
            - name: coming-soon
              label: Coming Soon
      - name: appStoreUrl
        label: App Store URL
        type: string
        description: Coming Soon 앱은 비워 둡니다.
        pattern:
          regex: '^(https://apps\.apple\.com/.+)?$'
          message: https://apps.apple.com/으로 시작하는 주소를 입력하세요.
      - name: privacyStatus
        label: 개인정보처리방침 상태
        type: select
        required: true
        options:
          values:
            - name: published
              label: 공개
            - name: pending
              label: 검토 중
      - name: theme
        label: 앱 테마
        type: select
        required: true
        options:
          values:
            - name: assetscaler
              label: AssetScaler
            - name: andromeda
              label: Andromeda
            - name: wordrush
              label: Word Rush
            - name: answerbychance
              label: AnswerByChance
      - name: appleServices
        label: 사용하는 Apple 서비스
        type: select
        options:
          multiple: true
          values: [MusicKit, Game Center]
      - name: icon
        label: 앱 아이콘
        type: image
        required: true
        description: 해당 앱 slug 폴더의 icon.webp를 선택하세요.
        options:
          media: app_images
          extensions: [webp]
      - name: heroImage
        label: Hero 이미지
        type: image
        required: true
        description: 해당 앱 slug 폴더의 hero.webp를 선택하세요.
        options:
          media: app_images
          extensions: [webp]
      - name: heroSize
        label: Hero 이미지 크기
        component: image_size
        required: true
      - name: screenshots
        label: 스크린샷
        type: object
        required: true
        list:
          min: 1
          max: 8
          collapsible:
            collapsed: true
            summary: '{src}'
        fields:
          - name: src
            label: 이미지
            type: image
            required: true
            options:
              media: app_images
              extensions: [webp]
          - name: width
            label: 너비
            type: number
            required: true
            options:
              min: 1
          - name: height
            label: 높이
            type: number
            required: true
            options:
              min: 1
          - name: label
            component: localized_label
            required: true
      - name: ogImage
        label: 공유 이미지
        type: image
        required: true
        description: 해당 앱 slug 폴더의 og.webp를 선택하세요.
        options:
          media: app_images
          extensions: [webp]
      - name: content
        label: 다국어 콘텐츠
        type: object
        required: true
        fields:
          - name: ko
            label: 한국어
            component: localized_content
            required: true
          - name: en
            label: English
            component: localized_content
            required: true
          - name: ja
            label: 日本語
            component: localized_content
            required: true
