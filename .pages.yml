media:
  - name: app_images
    label: 앱 이미지
    input: public/images/apps
    output: /images/apps
    categories: [image]
    extensions: [avif, gif, jpeg, jpg, png, svg, webp]
    rename: false
  - name: home_videos
    label: 메인 동영상
    input: public/videos
    output: /videos
    categories: [video]
    extensions: [mp4]
    rename: false
    commit:
      templates:
        create: 'chore. 메인 동영상 업로드: {filename}'
        update: 'chore. 메인 동영상 교체: {filename}'
        delete: 'chore. 메인 동영상 삭제: {filename}'
        rename: 'chore. 메인 동영상 이름 변경: {oldFilename} -> {newFilename}'
  - name: site_images
    label: 사이트 이미지
    input: public
    output: /
    categories: [image]
    extensions: [avif, gif, jpeg, jpg, png, svg, webp]
    rename: false

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: 'docs. 사이트 콘텐츠 생성: {path}'
      update: 'docs. 사이트 콘텐츠 수정: {path}'
      delete: 'docs. 사이트 콘텐츠 삭제: {path}'
      rename: 'docs. 사이트 콘텐츠 이름 변경: {oldPath} -> {newPath}'

components:
  image_size:
    type: object
    label: 이미지 크기
    fields:
      - name: width
        label: 너비
        type: number
        required: true
        options:
          min: 1
      - name: height
        label: 높이
        type: number
        required: true
        options:
          min: 1

  localized_label:
    type: object
    label: 접근성 설명
    fields:
      - name: ko
        label: 한국어
        type: string
        required: true
      - name: en
        label: English
        type: string
        required: true
      - name: ja
        label: 日本語
        type: string
        required: true

  localized_content:
    type: object
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: shortDescription
        label: 짧은 설명
        type: text
        required: true
      - name: longDescription
        label: 상세 설명
        type: text
        required: true
      - name: features
        label: 주요 기능
        type: string
        required: true
        list:
          min: 1
      - name: steps
        label: 사용 방법
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - name: title
            label: 단계 제목
            type: string
            required: true
          - name: description
            label: 단계 설명
            type: text
            required: true
      - name: faq
        label: 자주 묻는 질문
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{question}'
        fields:
          - name: question
            label: 질문
            type: string
            required: true
          - name: answer
            label: 답변
            type: text
            required: true
      - name: seoTitle
        label: SEO 제목
        type: string
        required: true
      - name: seoDescription
        label: SEO 설명
        type: text
        required: true

content:
  - name: site_settings
    label: 사이트 설정
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: homeVideo
        label: 메인 동영상
        type: object
        required: true
        fields:
          - name: enabled
            label: 동영상 사용
            type: boolean
            required: true
            description: 켜면 앱 아이콘 영역 대신 선택한 동영상이 표시됩니다.
          - name: sourceMode
            label: 동영상 입력 방식
            type: select
            required: true
            options:
              values:
                - name: upload
                  label: MP4 파일 업로드
                - name: external
                  label: 외부 MP4 링크
          - name: uploadedFile
            label: 업로드한 MP4 파일
            type: file
            description: 입력 방식이 파일 업로드일 때 사용합니다. 큰 파일은 외부 링크를 권장합니다.
            options:
              media: home_videos
              categories: [video]
              extensions: [mp4]
              rename: false
          - name: externalUrl
            label: 외부 MP4 URL
            type: string
            description: 입력 방식이 외부 링크일 때 사용하는 HTTPS 직접 재생 주소입니다. YouTube 페이지 주소는 사용할 수 없습니다.
            pattern:
              regex: '^(https://.+)?$'
              message: 비워 두거나 https://로 시작하는 직접 MP4 주소를 입력하세요.
          - name: poster
            label: 포스터 이미지
            type: image
            description: 동영상이 로드되기 전 표시할 이미지를 선택합니다. 비워 둘 수 있습니다.
            options:
              media: site_images
              categories: [image]
          - name: autoplay
            label: 자동 재생
            type: boolean
            required: true
            description: 자동 재생을 켜면 브라우저 호환성을 위해 음소거도 켜야 합니다.
          - name: muted
            label: 음소거
            type: boolean
            required: true
          - name: loop
            label: 반복 재생
            type: boolean
            required: true
          - name: controls
            label: 재생 컨트롤 표시
            type: boolean
            required: true

  - name: apps
    label: 앱 콘텐츠
    type: collection
    path: src/data/apps
    format: json
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: name
      fields: [name, platform, status]
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: slug
        label: URL slug
        type: string
        required: true
        readonly: true
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      - name: name
        label: 앱 이름
        type: string
        required: true
      - name: platform
        label: 표시 플랫폼
        type: string
        required: true
      - name: platformGroup
        label: 플랫폼 그룹
        type: select
        required: true
        options:
          values:
            - name: macos
              label: macOS
            - name: mobile
              label: iPhone & iPad
            - name: tv
              label: Apple TV
      - name: category
        label: 카테고리
        type: string
        required: true
      - name: status
        label: 출시 상태
        type: select
        required: true
        options:
          values:
            - name: released
              label: 출시됨
            - name: coming-soon
              label: Coming Soon
      - name: appStoreUrl
        label: App Store URL
        type: string
        description: Coming Soon 앱은 비워 둡니다.
        pattern:
          regex: '^(https://apps\.apple\.com/.+)?$'
          message: https://apps.apple.com/으로 시작하는 주소를 입력하세요.
      - name: privacyStatus
        label: 개인정보처리방침 상태
        type: select
        required: true
        options:
          values:
            - name: published
              label: 공개
            - name: pending
              label: 검토 중
      - name: theme
        label: 앱 테마
        type: select
        required: true
        options:
          values:
            - name: assetscaler
              label: AssetScaler
            - name: andromeda
              label: Andromeda
            - name: wordrush
              label: Word Rush
            - name: answerbychance
              label: AnswerByChance
      - name: appleServices
        label: 사용하는 Apple 서비스
        type: select
        options:
          multiple: true
          values: [MusicKit, Game Center]
      - name: icon
        label: 앱 아이콘
        type: image
        required: true
        description: 해당 앱 slug 폴더의 icon.webp를 선택하세요.
        options:
          media: app_images
          extensions: [webp]
      - name: heroImage
        label: Hero 이미지
        type: image
        required: true
        description: 해당 앱 slug 폴더의 hero.webp를 선택하세요.
        options:
          media: app_images
          extensions: [webp]
      - name: heroSize
        label: Hero 이미지 크기
        component: image_size
        required: true
      - name: screenshots
        label: 스크린샷
        type: object
        required: true
        list:
          min: 1
          max: 8
          collapsible:
            collapsed: true
            summary: '{src}'
        fields:
          - name: src
            label: 이미지
            type: image
            required: true
            options:
              media: app_images
              extensions: [webp]
          - name: width
            label: 너비
            type: number
            required: true
            options:
              min: 1
          - name: height
            label: 높이
            type: number
            required: true
            options:
              min: 1
          - name: label
            component: localized_label
            required: true
      - name: ogImage
        label: 공유 이미지
        type: image
        required: true
        description: 해당 앱 slug 폴더의 og.webp를 선택하세요.
        options:
          media: app_images
          extensions: [webp]
      - name: content
        label: 다국어 콘텐츠
        type: object
        required: true
        fields:
          - name: ko
            label: 한국어
            component: localized_content
            required: true
          - name: en
            label: English
            component: localized_content
            required: true
          - name: ja
            label: 日本語
            component: localized_content
            required: true
