version: 1

review:
  include:
    # Astro application source
    - 'src/**/*.astro'
    - 'src/**/*.ts'
    - 'src/**/*.js'
    - 'src/**/*.mjs'
    - 'src/**/*.css'
    - 'src/**/*.md'
    - 'src/**/*.mdx'
    - 'src/**/*.yaml'
    - 'src/**/*.yml'

    # Build, tooling, and deployment configuration
    - 'scripts/**/*.js'
    - 'scripts/**/*.mjs'
    - '.github/workflows/**/*.yaml'
    - '.github/workflows/**/*.yml'
    - 'astro.config.ts'
    - 'eslint.config.js'
    - '.prettierrc.mjs'
    - '.env.example'
    - '.pnpmrc'
    - '.stackblitzrc'
    - 'package.json'
    - 'pnpm-workspace.yaml'
    - 'tsconfig.json'
    - 'Dockerfile'
    - '.dockerignore'
    - 'docker-compose.yml'
    - 'nginx/**/*.conf'
    - 'netlify.toml'
    - 'vercel.json'
    - 'public/_headers'
    - 'public/CNAME'
    - 'public/robots.txt'
    - 'public/manifest.webmanifest'
    - 'public/decapcms/**/*.html'
    - 'public/decapcms/**/*.yml'

    # Repository guidance and documentation
    - '.reviewbot.yml'
    - '.gitignore'
    - 'AGENTS.md'
    - 'CLAUDE.md'
    - 'README.md'

  exclude:
    # Dependencies and generated build output
    - 'node_modules/**'
    - 'dist/**'
    - '.astro/**'
    - '.output/**'
    - '.cache/**'
    - 'coverage/**'
    - '**/*.map'

    # Vendored AstroWind integration and local tooling metadata
    - 'vendor/**'
    - '.agents/**'
    - '.vscode/**'

    # Images, video, audio, fonts, and other binary assets
    - '**/*.avif'
    - '**/*.gif'
    - '**/*.ico'
    - '**/*.jpeg'
    - '**/*.jpg'
    - '**/*.png'
    - '**/*.svg'
    - '**/*.webp'
    - '**/*.mp4'
    - '**/*.mov'
    - '**/*.webm'
    - '**/*.mp3'
    - '**/*.m4a'
    - '**/*.wav'
    - '**/*.woff'
    - '**/*.woff2'
    - '**/*.ttf'
    - '**/*.otf'
    - '**/*.pdf'

    # Package-manager lock files
    - 'package-lock.json'
    - 'pnpm-lock.yaml'
    - 'yarn.lock'
    - 'bun.lock'
    - 'bun.lockb'

    # Non-reviewable local and generated files
    - '**/.DS_Store'
    - '**/*.log'
    - '**/.gitkeep'
    - 'LICENSE.md'

  always_review:
    - '.reviewbot.yml'
    - '.gitignore'
    - 'AGENTS.md'
    - 'CLAUDE.md'
    - 'README.md'
    - '.env.example'
    - 'package.json'
    - 'astro.config.ts'
    - 'src/config/site.ts'
    - 'src/data/apps.ts'
    - '.github/workflows/actions.yaml'
    - '.github/workflows/deploy.yml'
    - 'public/_headers'
    - 'public/CNAME'
